<?xml version="1.0" encoding="UTF-8"?>
<root xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">

  <html:div class="dedup-prefs">
    <html:h2>Zotero Dedup 设置</html:h2>

    <html:div class="row">
      <html:label>查重规则：
        <html:select id="rule">
          <html:option value="title-author-year">标题 + 作者 + 年份（推荐）</html:option>
          <html:option value="title">仅按标题归一化</html:option>
          <html:option value="doi">按 DOI（最严格，无 DOI 不参与匹配）</html:option>
          <html:option value="pdf">仅按 PDF 内容（MD5，识别内容相同但文件名不同的 PDF）</html:option>
        </html:select>
      </html:label>
    </html:div>

    <html:div class="row">
      <html:label>默认扫描范围：
        <html:select id="scope">
          <html:option value="collection">当前选中的收藏夹</html:option>
          <html:option value="selected">当前选中条目所在分类</html:option>
        </html:select>
      </html:label>
    </html:div>

    <html:p class="hint">「开始扫描」位于 Zotero 顶部「工具」菜单。删除仅移入回收站，可在回收站中恢复。</html:p>
  </html:div>

  <html:style><![CDATA[
    .dedup-prefs { padding: 16px 20px; font: 13px/1.6 system-ui, sans-serif; }
    .dedup-prefs h2 { font-size: 15px; margin: 0 0 12px; }
    .dedup-prefs .row { margin: 10px 0; }
    .dedup-prefs label { display: inline-flex; align-items: center; gap: 8px; }
    .dedup-prefs select { font: inherit; padding: 3px 6px; }
    .dedup-prefs .hint { color: #666; }
  ]]></html:style>

  <script type="application/javascript"><![CDATA[
    'use strict';
    const PREFS = {
      rule: 'extensions.zotero-dedup.rule',
      scope: 'extensions.zotero-dedup.scope'
    };
    function apply() {
      document.getElementById('rule').value = Zotero.Prefs.get(PREFS.rule, true) || 'title-author-year';
      document.getElementById('scope').value = Zotero.Prefs.get(PREFS.scope, true) || 'collection';
    }
    document.getElementById('rule').addEventListener('change', e => Zotero.Prefs.set(PREFS.rule, e.target.value, true));
    document.getElementById('scope').addEventListener('change', e => Zotero.Prefs.set(PREFS.scope, e.target.value, true));
    apply();
  ]]></script>
</root>
