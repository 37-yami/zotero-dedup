<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title>Zotero Dedup — 正在扫描</title>
  <script src="chrome://zotero/content/include.js"></script>
  <style>
    body {
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      margin: 0;
      padding: 24px 28px;
      color: #222;
      text-align: center;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0 8px;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      width: 0%;
      transition: width .15s ease;
    }
    .progress-text {
      color: #6b7280;
      font-size: 12px;
      margin: 0;
    }
    .muted {
      color: #6b7280;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1 id="title">正在扫描重复文献...</h1>
  <div class="progress-bar">
    <div id="progress-fill" class="progress-fill"></div>
  </div>
  <p id="progress-text" class="progress-text">0 / 0</p>
  <p class="muted">扫描完成后将自动显示结果</p>

  <script type="application/javascript"><![CDATA[
    'use strict';

    let ARGS = null;
    let total = 0;

    function updateProgress(current, totalItems) {
      if (totalItems) total = totalItems;
      const pct = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').textContent = current + ' / ' + total;
    }

    function init() {
      ARGS = window.arguments && window.arguments[0];
      if (ARGS) {
        total = ARGS.total || 0;
        if (ARGS.title) {
          document.title = ARGS.title;
          document.getElementById('title').textContent = ARGS.title.replace(/^Zotero Dedup — /, '');
        }
        updateProgress(0, total);
      }

      // Expose updateProgress to the opener window
      window.updateProgress = updateProgress;

      Zotero.debug('[Zotero Dedup] Progress window opened, total=' + total);
    }

    window.addEventListener('load', init);
  ]]></script>
</body>
</html>
